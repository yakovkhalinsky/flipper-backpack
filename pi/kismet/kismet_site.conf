# /etc/kismet/kismet_site.conf — installed by install-kismet.sh (flipper-backpack).
# Overrides the packaged config; survives Kismet upgrades.
# PASSIVE MONITORING ONLY. Only monitor networks you own or are permitted to.

# --- Web UI / REST API: loopback only, never exposed on Wi-Fi ---
httpd_bind_address=127.0.0.1
httpd_port=2501

# --- Capture source: a USB adapter that supports monitor mode (NOT wlan0) ---
# Edit the interface to match your adapter (see `iw dev`). The onboard
# brcmfmac radio stays on wlan0 for normal Wi-Fi.
source=wlan1:name=usbwifi
# Uncomment to add Bluetooth (passive scan); costs RAM/CPU on a Zero 2W.
#source=hci0:name=bt

# --- Logging: small, single format ---
log_prefix=/var/log/kismet/
log_types=kismet
# Drop packets/devices/alerts from the log DB after they age out (seconds).
kis_log_packet_timeout=600
kis_log_device_timeout=3600
kis_log_alert_timeout=3600

# --- Memory: the Zero 2W has 512 MB ---
tracker_device_timeout=900
tracker_max_devices=2000
track_device_rrds=false
keep_location_cloud_history=false
keep_datasource_signal_history=false
alertbacklog=50
